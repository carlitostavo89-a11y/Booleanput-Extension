<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booleanput PRO</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #121212; color: #fff; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .card { background: #1e1e1e; padding: 2rem; border-radius: 12px; border: 1px solid #333; text-align: center; max-width: 400px; }
    h1 { color: #5CB1D6; margin-bottom: 0.5rem; }
    p { color: #aaa; font-size: 0.9rem; }
    button { background: #5CB1D6; color: #fff; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 1rem; width: 100%; }
    button:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <div class="card">
    <h1>Booleanput PRO</h1>
    <p>Extensión dinámica con autosync de color para TurboWarp.</p>
    <button onclick="navigator.clipboard.writeText(window.location.href + 'booleanput.js'); alert('¡URL de la extensión copiada!');">Copiar URL de la extensión</button>
  </div>
</body>
</html>
